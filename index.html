<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港國家安全知識測驗</title>
    <style>
        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        h1 {
            color: #d40000;
            text-align: center;
            border-bottom: 2px solid #d40000;
            padding-bottom: 10px;
        }
        .quiz-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .question {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .options {
            margin-left: 20px;
        }
        .option {
            margin: 8px 0;
        }
        button {
            background-color: #d40000;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            display: block;
            margin: 20px auto;
        }
        button:hover {
            background-color: #b30000;
        }
        .result {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            display: none;
        }
        .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo img {
            height: 80px;
        }
        .error {
            color: red;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="logo">
        <img src="https://www.nsed.gov.hk/images/logo.png" alt="香港特別行政區政府國家安全處標誌">
    </div>
    <h1>香港國家安全知識測驗</h1>
    
    <div class="quiz-container">
        <div class="error" id="error-msg">請回答所有問題後再提交！</div>
        <form id="quiz-form">
            <!-- 這裡是20個問題，與之前相同 -->
            <!-- 為節省空間，問題部分省略，實際使用時請保留 -->
            
            <button type="button" onclick="validateForm()">提交答案</button>
        </form>
        
        <div class="result" id="result"></div>
    </div>

    <script>
        const correctAnswers = {
            q1: "C",
            q2: "C",
            q3: "A",
            q4: "A",
            q5: "D",
            q6: "B",
            q7: "D",
            q8: "D",
            q9: "A",
            q10: "B",
            q11: "A",
            q12: "C",
            q13: "B",
            q14: "D",
            q15: "C",
            q16: "D",
            q17: "C",
            q18: "C",
            q19: "B",
            q20: "D"
        };

        function validateForm() {
            const form = document.getElementById("quiz-form");
            let allAnswered = true;
            
            // 檢查每個問題是否已回答
            for (let i = 1; i <= 20; i++) {
                const questionName = "q" + i;
                const selectedOption = form.elements[questionName].value;
                
                if (!selectedOption) {
                    allAnswered = false;
                    break;
                }
            }
            
            if (!allAnswered) {
                // 顯示錯誤訊息
                document.getElementById("error-msg").style.display = "block";
                // 滾動到錯誤訊息位置
                document.getElementById("error-msg").scrollIntoView({ behavior: 'smooth' });
                return;
            }
            
            // 隱藏錯誤訊息
            document.getElementById("error-msg").style.display = "none";
            // 計算分數
            calculateScore();
        }

        function calculateScore() {
            let score = 0;
            const form = document.getElementById("quiz-form");
            
            for (let i = 1; i <= 20; i++) {
                const questionName = "q" + i;
                const selectedOption = form.elements[questionName].value;
                
                if (selectedOption === correctAnswers[questionName]) {
                    score++;
                }
            }
            
            const resultElement = document.getElementById("result");
            resultElement.textContent = `您的得分是: ${score}/20`;
            resultElement.style.display = "block";
            
            // 根據分數給出不同評價
            if (score >= 18) {
                resultElement.style.color = "green";
                resultElement.textContent += "，優秀！您對香港國家安全知識掌握得很好！";
            } else if (score >= 15) {
                resultElement.style.color = "blue";
                resultElement.textContent += "，良好！您對香港國家安全知識有較好了解！";
            } else if (score >= 10) {
                resultElement.style.color = "orange";
                resultElement.textContent += "，及格！建議您進一步學習香港國家安全相關知識！";
            } else {
                resultElement.style.color = "red";
                resultElement.textContent += "，不及格！請認真學習香港國家安全相關知識！";
            }
            
            // 滾動到結果位置
            resultElement.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
